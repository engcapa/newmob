id: TC-IDE-C0-02
title: "Save receipt dirty/saved state, keyboard focus, announcement, and undo"
description: |
  ED-SAVE-004 browser behavior and accessibility slice. It opens the browser
  VFS through the production workspace entry, uses the real CodeMirror save
  shortcut at 200% editor zoom, and observes only production receipt metadata.
  It verifies dirty/saved state, receipt identity and hashes, live-region
  semantics, focus retention, and one undo back to the saved text. The browser
  VFS is not native disk evidence; stale in-flight behavior is covered by the
  mounted deferred-writer regression and real bytes by TC-IDE-C0-01.
covers: [F25.5, F1.7]
tags: [code-workspace, ide-c0, save, receipt, accessibility, p0]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 150
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'

  # Set the editor to the product's 200% equivalent before exercising save.
  - click: '[data-testid="code-workspace-tab"]'
  - press: Control+Shift+N
  - wait_for:
      selector: '[data-testid="code-workspace-search-everywhere"]'
      timeout_sec: 30
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
  - click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
  - type: Editor Appearance Settings
  - click: '[data-testid="code-workspace-search-everywhere"] >> text=Editor Appearance Settings'
  - wait_for: '[data-testid="workspace-editor-appearance-settings-dialog"]'
  - fill:
      selector: '[data-testid="workspace-editor-appearance-font-size-px"]'
      value: "26"
  - click: '[data-testid="workspace-editor-appearance-apply"]'
  - wait_for:
      selector: '[data-testid="workspace-editor-appearance-settings-dialog"]'
      state: detached
  - assert_text:
      selector: '[data-testid="code-workspace-zoom-reset"]'
      contains: "26px"

  - fill:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      value: "receipt line one\nreceipt line two"
  - wait: 1
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: dirty
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: role
      equals: status
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: aria-live
      equals: polite
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: aria-atomic
      equals: "true"
  - assert_text:
      selector: '[data-testid="code-workspace-save-observation"]'
      contains: "Unsaved changes"
  - assert_attribute:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      name: role
      equals: textbox
  - assert_attribute:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      name: aria-multiline
      equals: "true"
  - eval_readonly:
      expression: 'document.querySelector(".cm-content:focus")?.matches(".cm-content")'
      expect_truthy: true

  - press: Control+s
  - wait: 1
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: saved
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: saved-current
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-write-count
      equals: "1"
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "false"
  - eval_readonly:
      expression: '/^[a-f0-9]{64}$/.test(document.getElementById("code-workspace-save-observation")?.getAttribute("data-encoded-bytes-sha256") ?? "")'
      expect_truthy: true
  - eval_readonly:
      expression: 'document.getElementById("code-workspace-save-observation")?.hasAttribute("data-final-text-sha256")'
      expect_truthy: true
  - assert_text:
      selector: '[data-testid="code-workspace-save-observation"]'
      contains: "Saved README.txt"
  - eval_readonly:
      expression: 'document.querySelector(".cm-content:focus")?.matches(".cm-content")'
      expect_truthy: true

  # One editor undo returns to the receipt-backed saved text without moving focus.
  - type: X
  - wait: 0.5
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: dirty
  - press: Control+z
  - wait: 0.5
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: clean
  - eval_readonly:
      expression: 'document.querySelector(".cm-content:focus")?.matches(".cm-content")'
      expect_truthy: true
  - screenshot: tc-ide-c0-browser-save-receipt.png

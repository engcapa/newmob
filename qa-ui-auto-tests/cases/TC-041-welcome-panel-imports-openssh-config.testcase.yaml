id: TC-041
title: Sessions menu exposes OpenSSH config import
covers: [F6.6]
tags: [import, legacy-imported, p1, welcome]
modes: [browser]
fixtures: [reset_db]
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: "[data-testid=\"welcome-panel\"]"
  - assert_not_visible: '[data-testid="welcome-panel"] >> text="Import OpenSSH config"'
  - click: '[data-testid="app-main-menu"]'
  - hover: '[data-testid="context-menu"] >> text="Import sessions"'
  - assert_visible: '[data-testid="context-menu"] >> [data-testid="import-openssh"]'
  - press: Escape
  - screenshot: 041-import-openssh-config.png

id: TC-IDE-C5-01
title: "QuickDoc unavailable contract and Type hierarchy provider gate"
description: |
  §8.19.10 gate case C5 (unavailable-contract portion). Capability ids:
  editor.quick-doc / navigation.type-hierarchy. Provider-backed hover docs,
  pin/history and Parameter overload switching need the jdtls fixture
  (provider mode); those steps belong to the native run. The browser run
  pins the honest unavailable contracts: Type Hierarchy action reports its
  typed unavailable state instead of silently no-oping when no provider is
  attached. Highest claim on green: L1 unavailable-contract only.
covers: [F25.5]
tags: [code-workspace, ide-c5, quickdoc, hierarchy, unavailable-contract, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Add the browser-VFS preview folder (/preview prefilled in the prompt).
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  # Open README.txt into the active leaf.
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'

  - click: '[data-testid="code-workspace-bottom-tab-analysis"]'
  - wait_for: '[data-testid="code-workspace-analysis-panel"]'
  - screenshot: tc-ide-c5-analysis-empty-provider.png
  # Focus an editor so editor-scoped actions resolve against README.txt.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  # QuickDoc on a plain-text file without provider: no popup crash, status
  # message explains unavailability.
  - press: Control+q
  - screenshot: tc-ide-c5-quickdoc-unavailable.png

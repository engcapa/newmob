id: TC-064
title: Code Workspace tab opens and presents editor workspace shell
covers: [F25.1]
tags: [code-workspace, editor, p1]
modes: [browser]
fixtures: [reset_db]
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: "[data-testid=\"tab-bar\"]"
  - click: "[data-testid=\"side-tab-tools\"]"
  - click: "[data-testid=\"sidebar-tool-code-workspace\"]"
  - wait_for: "[data-testid=\"code-workspace-tab\"]"
  - assert_count: {selector: '[data-testid="code-workspace-tab"]', equal: 1}
  - screenshot: 064-code-workspace-shell.png

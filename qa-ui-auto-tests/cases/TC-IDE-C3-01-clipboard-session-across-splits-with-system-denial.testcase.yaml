id: TC-IDE-C3-01
title: "Cross-leaf clipboard paste; rectangle and denial stay native"
description: |
  §8.19.10 gate case C3 (browser portion). Capability ids:
  workspace.clipboard-single-slot / clipboard.history-paste.
  Browser verifies cross-leaf plain paste through the workspace clipboard
  slot. System-clipboard ownership, rectangle selection paste and OS-level
  denial are NATIVE concerns (R9 manifest). Highest claim on green: L1
  browser-wired plain-path.
covers: [F25.5]
tags: [code-workspace, ide-c3, clipboard, split, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Add the browser-VFS preview folder (/preview prefilled in the prompt).
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  # Open README.txt into the active leaf.
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'

  # Copy a line into the workspace clipboard slot from leaf A.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Home
  - press: Shift+End
  - press: Control+c
  # Split right; paste into leaf B and verify the text arrived.
  - click: '[data-testid="code-workspace-split-right"]'
  - assert_count: {selector: '[data-testid="code-workspace-editor-pane"]', min: 2}
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: End
  - press: Control+v
  - screenshot: tc-ide-c3-cross-leaf.png
  # History ring: paste-previous cycles back to the older entry.
  - press: Control+Shift+v
  - screenshot: tc-ide-c3-history.png

id: TC-IDE-C2-02-completion-scope-fallback-browser
title: "Explicit completion names missing project scope in browser"
description: |
  Browser gate case (ED-COMP-004 A3). In the stub preview no ready project
  snapshot can exist, so an explicitly invoked completion (Ctrl+Space) must
  record scope-facts-missing and name the missing prerequisite once via the
  status bar instead of guessing module scope. Typing-triggered popups stay
  silent by contract (covered by unit tests). The ready-scope path is proven
  by unit tests and the native provider gate.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Control+Space
  - assert_text:
      selector: '[data-testid="status-bar-message"]'
      contains: "Completion project scope unavailable"
      timeout_sec: 20
  - assert_text:
      selector: '[data-testid="status-bar-message"]'
      contains: "using document scope"
      timeout_sec: 10
  - screenshot: tc-ide-c2-02-scope-fallback.png

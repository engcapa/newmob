id: TC-107
title: Saved VNC session mounts the authenticated panel path
description: |
  Browser wiring coverage for the saved-session route. It creates a VNC
  bookmark, opens the tab and verifies that the relay-backed panel and canvas
  mount even when no VNC fixture is configured. It does not claim a successful
  RFB handshake; those assertions live in Rust fixtures and manual WKWebView
  release checks.
covers: [F9.6]
tags: [smoke, p0, vnc]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 45
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="sidebar"]'
  - click: '[data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="session-new"]'
  - click: '[data-testid="session-new"]'
  - wait_for: '[data-testid="session-editor"]'
  - click: '[data-testid="session-proto-vnc"]'
  - fill:
      selector: '[data-testid="session-host"]'
      value: vnc-host.example.test
  - fill:
      selector: '[data-testid="session-port"]'
      value: "5900"
  - click: '[data-testid="session-section-bookmark"]'
  - wait_for: '[data-testid="bookmark-settings"]'
  - fill:
      selector: '[data-testid="session-name"]'
      value: qa-ui-auto-vnc
  - click: '[data-testid="session-save"]'
  - wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc"]'
  # Authenticate with a one-shot test credential before the panel mounts.
  - open_session: { name: qa-ui-auto-vnc, double_click: true }
  - wait_for: '[data-testid="auth-prompt"]'
  - auth: qa-vnc-one-shot
  - wait_for:
      selector: '[data-testid="vnc-panel"]'
      timeout_sec: 10
  - assert_visible: '[data-testid="vnc-panel"]'
  # The canvas element is rendered (CSS display:none until connected) — assert it's attached.
  - wait_for:
      selector: '[data-testid="vnc-canvas"]'
      state: attached
      timeout_sec: 5
  - screenshot: 107-vnc-panel.png

id: TC-107
title: Saved VNC production options route into the VNC panel
description: |
  Coverage smoke for F9.6. Saves explicit compatibility, clipboard, view-only
  and reconnect options, then opens the bookmark through the same auth and
  panel route used by a live connection. Real RFB pixels and input are covered
  by the protocol/QEMU fixture tests because browser mode has no Rust backend.
covers: [F9.6]
tags: [smoke, p1, vnc, session-options]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 45
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="sidebar"]'
  - click: '[data-testid="welcome-new-session"]'
  - wait_for: '[data-testid="session-editor"]'
  - click: '[data-testid="session-proto-vnc"]'
  - fill:
      selector: '[data-testid="session-host"]'
      value: vnc-host.example.test
  - fill:
      selector: '[data-testid="session-port"]'
      value: "5900"
  - select_option: { selector: '[data-testid="vnc-security-policy"]', value: allow-none }
  - select_option: { selector: '[data-testid="vnc-clipboard-policy"]', value: server-to-client }
  - set_check: { selector: '[data-testid="vnc-view-only"]', checked: true }
  - set_check: { selector: '[data-testid="vnc-clipboard-html"]', checked: true }
  - set_check: { selector: '[data-testid="vnc-clipboard-rtf"]', checked: true }
  - select_option: { selector: '[data-testid="vnc-clipboard-limit"]', value: "4194304" }
  - fill: { selector: '[data-testid="vnc-reconnect-attempts"]', value: "2" }
  - click: '[data-testid="session-section-bookmark"]'
  - wait_for: '[data-testid="bookmark-settings"]'
  - fill:
      selector: '[data-testid="session-name"]'
      value: qa-ui-auto-vnc
  - click: '[data-testid="session-save"]'
  # The browser smoke profile may persist a collapsed sidebar from a previous
  # run. The compact rail keeps the Sessions tab available and expands the
  # full tree when selected.
  - click: '[data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc"]'
  # Open the VNC tab — the panel mounts immediately, regardless of dial state.
  - open_session: { name: qa-ui-auto-vnc, double_click: true }
  # Saved VNC sessions intentionally prompt for a one-shot password when no
  # vault reference exists. Submit a fixture-only value; the browser stub may
  # fail the actual dial, but the tab/panel path is still exercised.
  - wait_for: '[data-testid="auth-prompt"]'
  - fill:
      selector: '[data-testid="auth-password"]'
      value: fixture-only-password
  - click: '[data-testid="auth-submit"]'
  - wait_for:
      selector: '[data-testid="vnc-panel"]'
      timeout_sec: 10
  - assert_visible: '[data-testid="vnc-panel"]'
  # The canvas element is rendered (CSS display:none until connected) — assert it's attached.
  - wait_for:
      selector: '[data-testid="vnc-canvas"]'
      state: attached
      timeout_sec: 5
  - screenshot: 107-vnc-saved.png

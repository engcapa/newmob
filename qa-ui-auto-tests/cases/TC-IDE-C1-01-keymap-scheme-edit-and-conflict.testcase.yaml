id: TC-IDE-C1-01
title: "Keymap scheme surface: action binding recorded, conflict, close"
description: |
  §8.19.10 gate case C1 (browser portion). Capability ids:
  editor.keymap-editable / keymap.scheme-surface.
  Required mode: browser (settings surface is pure UI/store); physical
  layout and OS shortcut interception stay native. Highest claim on green:
  L1 browser-wired. Dispatches workspace.keymapSettings through Search
  Everywhere, records a fresh primary chord on editor.replace via the
  two-stroke recorder, verifies the replace slot renders, then closes.
covers: [F25.5]
tags: [code-workspace, ide-c1, keymap, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Add the browser-VFS preview folder (/preview prefilled in the prompt).
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  # Open a file first: editor.replace is requiresEditor and is filtered from
  # the keymap rows while no editor is open.
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'

  # Normalize focus into the workspace surface, then dispatch
  # workspace.keymapSettings from the action palette.
  - click: '[data-testid="code-workspace-tab"]'
  - wait: 0.3
  - press: Control+Shift+N
  - wait_for:
      selector: '[data-testid="code-workspace-search-everywhere"]'
      timeout_sec: 30
  # The palette remembers its last tab (Files/Classes/...); select Actions
  # explicitly so the command entry is searchable. Clicking the tab moves
  # focus off the input, so refocus the quick-pick input before typing.
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
  - click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
  - type: Keymap Settings
  - click: '[data-testid="code-workspace-search-everywhere"] >> text=Keymap Settings'
  - wait_for: '[data-testid="workspace-keymap-settings-dialog"]'
  - assert_visible: '[data-testid="keymap-scheme-select"]'
  # The built-in scheme is readOnly; copy it first so rows become mutable
  # (keymap-add-*/keymap-replace-* only render for a mutable scheme).
  - click: '[data-testid="workspace-keymap-settings-dialog"] >> text=Copy'
  - fill:
      selector: '[data-testid="keymap-action-filter"]'
      value: Replace in File
  - wait_for: '[data-testid="keymap-row-editor.replace"]'
  - screenshot: tc-ide-c1-dialog.png
  # Record a new primary chord with the two-stroke recorder; Enter commits
  # the capture (Esc cancels, Backspace pops a stroke).
  - click: '[data-testid="keymap-add-editor.replace"]'
  - press: Alt+Shift+r
  - press: Enter
  - assert_visible: '[data-testid="keymap-replace-editor.replace-0"]'
  - screenshot: tc-ide-c1-recorded.png
  - click: '[data-testid="keymap-settings-close"]'
  - wait_for:
      selector: '[data-testid="workspace-keymap-settings-dialog"]'
      state: detached
      timeout_sec: 5

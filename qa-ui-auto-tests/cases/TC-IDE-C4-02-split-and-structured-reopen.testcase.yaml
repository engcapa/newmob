id: TC-IDE-C4-02
title: "Three-leaf split management and structured reopen (browser portion)"
description: |
  §8.19.10 / §ED-TABS-004: Split management and structured reopen case.
  Browser verifies the store/UI/action contract:
  three leaves via split-right/split-down, equalize + unsplit-all without
  losing buffers, leaf close and structured reopen via Ctrl+Shift+T.
  The hold-modifier Ctrl+Tab switcher cycle (and its graded Backspace)
  commits on physical key release — per-step browser input cannot express
  it; that portion is pinned by CodeWorkspaceTab.test.tsx and belongs to
  the NATIVE keyboard run. Highest claim on green here: L1 browser-wired
  split/reopen.
covers: [F25.1, F25.5]
tags: [code-workspace, ide-c4, switcher, split, reopen, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 150
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Add the browser-VFS preview folder (/preview prefilled in the prompt).
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  # Open README.txt into the active leaf.
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'

  # Build leaf #2 and leaf #3.
  - click: '[data-testid="code-workspace-split-right"]'
  - assert_count: {selector: '[data-testid="code-workspace-editor-pane"]', min: 2}
  - wait: 0.5
  - click: '[data-testid="code-workspace-split-down"]'
  - assert_count: {selector: '[data-testid="code-workspace-editor-pane"]', min: 3}
  - wait: 0.5

  # Browser preview cannot create a local terminal (stub throws), so the
  # bottom-dock tool-window half of the switcher stays native-verified.
  - assert_visible: '[data-testid="code-workspace-split-equalize"]'
  - assert_visible: '[data-testid="code-workspace-split-unsplit-all"]'
  # Equalize normalizes the three leaves; screenshot documents the layout.
  - click: '[data-testid="code-workspace-split-equalize"]'
  - assert_count: {selector: '[data-testid="code-workspace-editor-pane"]', min: 3}
  - screenshot: tc-ide-c4-three-leaves.png
  # NOTE: the frozen Ctrl+Tab switcher cycle and its graded Backspace are
  # HOLD-MODIFIER interactions: the popup commits on key release, which
  # per-step CDP input cannot express. They are verified in component tests
  # (CodeWorkspaceTab.test.tsx) and stay in the NATIVE keyboard portion.
  # Unsplit merges back to one leaf without losing open buffers.
  - click: '[data-testid="code-workspace-split-unsplit-all"]'
  - wait: 0.5
  - assert_count: {selector: '[data-testid="code-workspace-editor-pane"]', equal: 1}

  # Close the focused editor tab (Ctrl+F4): the tab strip empties.
  - click: '[data-testid="code-workspace-tab"]'
  - wait: 0.3
  - press: Control+F4
  - assert_visible: '[data-testid="code-workspace-tree"]'
  - assert_count: {selector: '[data-testid="code-workspace-editor-tab-strip"]', max: 0}
  - screenshot: tc-ide-c4-after-close.png

  # W0 §8.20.1: with the reopen stack non-empty, the active workspace CLAIMS
  # Ctrl+Shift+T from the shell router — the chord reopens the closed file
  # instead of reaching MainLayout's new-local-terminal owner.
  - press: Control+Shift+T
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'
  - screenshot: tc-ide-c4-reopened.png

  # Switch to the welcome tab: no active workspace claim remains (the reopen
  # stack was popped above), so the SAME chord falls through to the shell
  # owner — a local terminal tab is created AND activated. Browser preview
  # has no PTY (stub rejects the connection) but the tab contract still holds.
  - click: '[data-testid="tab-item"][data-tab-type="welcome"]'
  - wait: 0.3
  - press: Control+Shift+T
  - wait_for: '[data-testid="tab-item"][data-tab-type="terminal"][data-active="true"]'
  - screenshot: tc-ide-c4-welcome-chord.png

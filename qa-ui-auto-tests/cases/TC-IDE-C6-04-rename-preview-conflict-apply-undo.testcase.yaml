id: TC-IDE-C6-04
title: "Rename preview conflict/apply/undo under jdtls"
description: |
  §8.19.10 gate case C6-04. Capability ids: rename.preview-conflict /
  semantic.workspace-edit-undo. Required mode: PROVIDER FIXTURE — rename
  conflict detection and cross-file WorkspaceEdit apply need jdtls.
  Browser runs must report environment-blocked, never passed. Highest
  claim on green: L2 provider-backed (Linux).
covers: [F25.5]
tags: [code-workspace, ide-c6, rename, provider-fixture, p1]
modes: [native]
fixtures: [reset_db, java_sample_projects, jdtls_required]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'
  # Enter the real sample project through persisted recents; WebDriver cannot
  # operate the native folder picker opened by Add Folder to Workspace.
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-c6-04","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "public static void main"
      timeout_sec: 60
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Shift+F6
  - screenshot: tc-ide-c6b-preview.png

id: TC-IDE-C0-01
title: "Save transaction, dirty marker, stale snapshot recovery ledger"
description: |
  §8.19.10 gate case C0. Capability ids: workspace.save-transaction /
  workspace.recovery-ledger / workspace.disk-hash.
  Required mode: NATIVE (disk hash re-read and close-during-write recovery
  need the Rust filesystem backend; browser stubs cannot prove them).
  Fixture id: none beyond a user-chosen scratch folder. Highest claim on
  green: L1 native single-platform. This run records environment-blocked
  until the tauri-driver harness provisions a fixture root (R9 owns the
  native manifest); it must never be marked passed from a browser run.
covers: [F25.1]
tags: [code-workspace, ide-c0, save, recovery, native-gate, p1]
modes: [native]
fixtures: [reset_db]
timeout_sec: 300
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Add the browser-VFS preview folder (/preview prefilled in the prompt).
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  # Open README.txt into the active leaf.
  - click: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'

  # Dirty the buffer, observe the dirty indicator, then save.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - type: c0 disk verification marker
  - assert_visible: '[data-testid="code-workspace-file-status"]'
  - screenshot: tc-ide-c0-dirty.png
  - press: Control+s
  - assert_text:
      selector: '[data-testid="code-workspace-file-status"]'
      contains: saved
      timeout_sec: 15
  # The v4 disk-effect ledger must classify this write as verified.
  - eval_readonly:
      expression: "JSON.stringify(localStorage).includes('save-effects') || JSON.stringify(localStorage).includes('verified')"
      expect_truthy: true
  - screenshot: tc-ide-c0-saved.png

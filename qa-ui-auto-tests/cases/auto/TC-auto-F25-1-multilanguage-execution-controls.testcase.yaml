id: TC-auto-F25-1
title: Code Workspace multilingual execution controls
description: |
  Browser smoke for the capability-driven Code Workspace Build, Run, and
  Debug surfaces. It verifies the empty-workspace capability state, panel
  navigation, and persistence of all runtime/build/debug tool overrides.
covers: [F25.1]
tags: [auto-generated, smoke, needs-review, code-workspace]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 45
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - assert_visible: '[data-testid="code-workspace-tab"]'
  - hover: '[data-testid="code-workspace-build-project"]'
  - assert_disabled: '[data-testid="code-workspace-build-project"]'
  - hover: '[data-testid="code-workspace-run-target"]'
  - assert_disabled: '[data-testid="code-workspace-run-target"]'
  - hover: '[data-testid="code-workspace-debug-target"]'
  - assert_disabled: '[data-testid="code-workspace-debug-target"]'

  - click: '[data-testid="code-workspace-bottom-tab-run"]'
  - assert_visible: '[data-testid="code-workspace-run-panel"]'
  - fill: { selector: '[data-testid="run-panel-custom-command"]', value: "echo smoke" }
  - click: '[data-testid="run-panel-add-custom-task"]'
  - click: '[data-testid="run-panel-refresh"]'
  - click: '[data-testid="run-panel-configure-tools"]'
  - assert_visible: '[data-testid="workspace-build-run-tools-dialog"]'
  - fill: { selector: '[data-testid="workspace-tool-cargo"]', value: "cargo-custom" }
  - fill: { selector: '[data-testid="workspace-tool-go"]', value: "go-custom" }
  - fill: { selector: '[data-testid="workspace-tool-node"]', value: "node-custom" }
  - fill: { selector: '[data-testid="workspace-tool-npm"]', value: "npm-custom" }
  - fill: { selector: '[data-testid="workspace-tool-pnpm"]', value: "pnpm-custom" }
  - fill: { selector: '[data-testid="workspace-tool-yarn"]', value: "yarn-custom" }
  - fill: { selector: '[data-testid="workspace-tool-python"]', value: "python-custom" }
  - fill: { selector: '[data-testid="workspace-tool-cmake"]', value: "cmake-custom" }
  - fill: { selector: '[data-testid="workspace-tool-dotnet"]', value: "dotnet-custom" }
  - fill: { selector: '[data-testid="workspace-tool-maven"]', value: "maven-custom" }
  - fill: { selector: '[data-testid="workspace-tool-gradle"]', value: "gradle-custom" }
  - fill: { selector: '[data-testid="workspace-tool-sbt"]', value: "sbt-custom" }
  - fill: { selector: '[data-testid="workspace-tool-swift"]', value: "swift-custom" }
  - fill: { selector: '[data-testid="workspace-tool-lldbDap"]', value: "lldb-dap-custom" }
  - fill: { selector: '[data-testid="workspace-tool-delve"]', value: "dlv-custom" }
  - fill: { selector: '[data-testid="workspace-tool-debugpy"]', value: "debugpy-custom" }
  - fill: { selector: '[data-testid="workspace-tool-jsDebug"]', value: "js-debug-custom" }
  - fill: { selector: '[data-testid="workspace-tool-netcoredbg"]', value: "netcoredbg-custom" }
  - fill:
      selector: '[data-testid="workspace-maven-run-jvm-args"]'
      value: "--add-opens=java.base/java.lang=ALL-UNNAMED"
  - set_check: { selector: '[data-testid="workspace-maven-inherit-argline"]', checked: false }
  - click: '[data-testid="workspace-build-run-tools-save"]'
  - eval_readonly:
      expression: "JSON.stringify(localStorage).includes('cargo-custom') && JSON.stringify(localStorage).includes('netcoredbg-custom')"
      expect_truthy: true

  - click: '[data-testid="run-panel-configure-tools"]'
  - assert_visible: '[data-testid="workspace-build-run-tools-dialog"]'
  - click: '[data-testid="workspace-build-run-tools-close"]'
  - click: '[data-testid="run-panel-configure-tools"]'
  - click: '[data-testid="workspace-build-run-tools-cancel"]'

  - click: '[data-testid="code-workspace-bottom-tab-build"]'
  - assert_visible: '[data-testid="code-workspace-build-panel"]'
  - click: '[data-testid="build-panel-refresh"]'
  - click: '[data-testid="code-workspace-bottom-tab-debug"]'
  - assert_visible: '[data-testid="code-workspace-debug-panel"]'
  - screenshot: auto-F25-1-multilanguage-execution-controls.png

id: TC-auto-F1-8
title: Unified app menu exposes every section and dispatches commands
description: |
  Rewritten for F1.8 after the per-menu MenuBar was removed: one unified
  app menu opens from the ControlBar app-main-menu button and renders
  top-level entries plus Sessions / View submenus on the shared
  context-menu surface. Exercises New local terminal end-to-end and
  verifies the status bar reflects the new tab.
covers: [F1.8]
tags: [auto-generated, smoke, p1, main, unified-menu, needs-review]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 60
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="app-main-menu"]'
  - assert_visible: '[data-testid="app-main-menu"]'

  # Top-level entries of the unified app menu
  - click: '[data-testid="app-main-menu"]'
  - wait_for: '[data-testid="context-menu"]'
  - assert_visible: '[data-testid="context-menu-item-new-local-terminal"]'
  - assert_visible: '[data-testid="context-menu"] >> text="New remote session…"'
  - assert_visible: '[data-testid="context-menu"] >> text="Close active tab"'
  - assert_visible: '[data-testid="context-menu-item-xserver"]'
  - assert_visible: '[data-testid="context-menu"] >> text="Settings"'
  - press: Escape
  - wait_for:
      selector: '[data-testid="context-menu"]'
      state: detached
      timeout_sec: 5

  # Sessions submenu
  - click: '[data-testid="app-main-menu"]'
  - hover: '[data-testid="context-menu"] >> text="Sessions"'
  - assert_visible: '[data-testid="context-menu"] >> text="New session…"'
  - assert_visible: '[data-testid="context-menu"] >> text="Show sessions"'
  - assert_visible: '[data-testid="context-menu-item-reload-sessions"]'
  - press: Escape
  - wait_for:
      selector: '[data-testid="context-menu"]'
      state: detached
      timeout_sec: 5

  # View submenu — sidebar toggle, quick connect, split
  - click: '[data-testid="app-main-menu"]'
  - hover: '[data-testid="context-menu-item-view"]'
  - assert_visible: '[data-testid="context-menu-item-toggle-quick-connect"]'
  - assert_visible: '[data-testid="context-menu-item-toggle-ribbon"]'
  - assert_visible: '[data-testid="context-menu"] >> text="Split active terminal"'
  - press: Escape
  - wait_for:
      selector: '[data-testid="context-menu"]'
      state: detached
      timeout_sec: 5

  # End-to-end: New local terminal opens a terminal pane
  - click: '[data-testid="app-main-menu"]'
  - wait_for: '[data-testid="context-menu"]'
  - click: '[data-testid="context-menu-item-new-local-terminal"]'
  - wait_for: '[data-testid="terminal-pane"]'
  - assert_text: {selector: '[data-testid="status-bar"]', contains: "1 terminals"}
  - screenshot: F1.8-unified-menu.png

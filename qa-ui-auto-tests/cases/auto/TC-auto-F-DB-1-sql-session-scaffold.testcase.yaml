id: TC-auto-F-DB-1-sql-session-scaffold
title: SQL session opens its offline query library and saves a query
description: |
  Creates a MySQL session in browser mode, opens it into the expected offline
  state, and verifies that the SQL editor and shared Query Library remain
  available even though db_connect is unavailable. Saves a connection-scoped
  query through the browser SQLite stub and exercises namespace/search filters.
covers: [F-DB-1, F-DB-4, F6.3]
tags: [auto-generated, smoke, needs-review, database, sql, query-library, no-connect]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 45
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="sidebar"]'
  - click: '[data-testid="session-new"]'
  - wait_for: '[data-testid="session-editor"]'
  # Selecting a DB proto auto-switches to the database section.
  - click: '[data-testid="session-proto-mysql"]'
  - wait_for:
      selector: '[data-testid="session-database-section"]'
      timeout_sec: 5
  - assert_visible: '[data-testid="database-settings"]'
  # Connection fields (host/port are shared top-of-form controls owned by F6.3).
  - fill:
      selector: '[data-testid="session-host"]'
      value: db-host.example.test
  - fill:
      selector: '[data-testid="session-port"]'
      value: "3306"
  # Engine-specific DB form fields (aria-label inputs in DatabaseSettings).
  - fill:
      selector: 'input[aria-label="Database username"]'
      value: qa_user
  - fill:
      selector: 'input[aria-label="Database name"]'
      value: qa_db
  # Name the bookmark and save.
  - click: '[data-testid="session-section-bookmark"]'
  - wait_for: '[data-testid="bookmark-settings"]'
  - fill:
      selector: '[data-testid="session-name"]'
      value: qa-ui-auto-mysql
  - click: '[data-testid="session-save"]'
  - wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mysql"]'
  - open_session: { name: qa-ui-auto-mysql, double_click: true }
  - wait_for: '[data-testid="db-connection-error-banner"]'
  - assert_visible: '[data-testid="sql-editor"]'
  - click: '[data-testid="db-query-library-tab"]'
  - wait_for: '[data-testid="query-library-panel"]'
  - click: '[data-testid="query-library-all-namespaces"]'
  - click: '[data-testid="query-library-current-namespace"]'
  - set_check:
      selector: '[data-testid="query-library-show-archived"]'
      checked: true
  - set_check:
      selector: '[data-testid="query-library-show-archived"]'
      checked: false
  - click: '[data-testid="query-library-create"]'
  - wait_for: '[data-testid="query-library-dialog"]'
  - fill:
      selector: '[data-testid="query-library-name"]'
      value: qa-ui-auto-query
  - fill:
      selector: '[data-testid="query-library-content"]'
      value: SELECT 42;
  - select_option:
      selector: '[data-testid="query-library-scope"]'
      value: connection
  - click: '[data-testid="query-library-save"]'
  - wait_for: '[data-testid^="saved-query-"]'
  - fill:
      selector: '[data-testid="query-library-search"]'
      value: qa-ui-auto-query
  - assert_count:
      selector: '[data-testid^="saved-query-"]'
      equal: 1
  - screenshot: db-1-query-library.png

id: TC-IDE-C6-02
title: "Semantic query definition/references/hierarchy under jdtls"
description: |
  §8.19.10 gate case C6-02 (ED-QUERY-004). Capability ids:
  query.definition / query.references / query.hierarchy / navigation.history.
  Asserts real caret parameters, result session, open/reveal, history back,
  in-flight query cancellation, and hierarchy tree expansion under jdtls.
  Browser runs verify unavailable contract; native runs verify provider fixture.
  Highest claim on green: L2 provider-backed (Linux).
covers: [F25.5]
tags: [code-workspace, ide-c6, query, definition, hierarchy, provider-fixture, p1]

id: TC-IDE-C2-01
title: "jdtls basic completion choice acceptance with one undo"
description: |
  §8.19.10 gate case C2. Capability ids: java.basic-completion /
  completion.choice-session. Required mode: PROVIDER FIXTURE (a versioned
  jdtls process over a real project — see src/components/editor/workspace/
  __fixtures__/jdtls). Browser mode cannot start jdtls; a green browser run
  proves nothing here and must be reported environment-blocked instead.
  Highest claim on green: L2 provider-backed (Linux).
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, provider-fixture, p1]
modes: [native]
fixtures: [reset_db, java_sample_projects, jdtls_required]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'
  # Enter the real sample project through persisted recents; WebDriver cannot
  # operate the native folder picker opened by Add Folder to Workspace.
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-c2-01","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  # Open the fixture Main.java, trigger Basic completion, accept a choice
  # item whose additionalTextEdits add the import, verify one undo removes
  # both the identifier completion and the import together.
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "completionTargets"
      timeout_sec: 60
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Control+Space
  - screenshot: tc-ide-c2-popup.png
  - press: Enter
  - press: Control+z
  - screenshot: tc-ide-c2-after-undo.png

id: TC-106
title: VNC session exposes production connection controls
description: |
  Browser wiring coverage for the VNC session editor. It exercises the
  security, view-only, clipboard and reconnect controls that are persisted
  into the VNC tab options. Rust RFB behavior is covered by the focused
  protocol fixtures; browser mode intentionally does not claim native relay
  or WKWebView coverage.
covers: [F6.3, F9.1]
tags: [smoke, p0, vnc]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 20
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="sidebar"]'
  - click: '[data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="session-new"]'
  - click: '[data-testid="session-new"]'
  - wait_for: '[data-testid="session-editor"]'
  - assert_visible: '[data-testid="session-proto-vnc"]'
  - click: '[data-testid="session-proto-vnc"]'
  - wait_for: '[data-testid="session-vnc-section"]'
  - select_option:
      selector: '[data-testid="vnc-security-policy"]'
      value: legacy-compatible
  - click: '[data-testid="vnc-allow-none"]'
  - click: '[data-testid="vnc-view-only"]'
  - select_option:
      selector: '[data-testid="vnc-clipboard-policy"]'
      value: server-to-client
  - click: '[data-testid="vnc-clipboard-text-only"]'
  - fill:
      selector: '[data-testid="vnc-reconnect-attempts"]'
      value: "3"
  - assert_visible: '[data-testid="vnc-security-policy"]'
  - screenshot: 106-vnc-options.png
